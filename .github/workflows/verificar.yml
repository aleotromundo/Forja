name: Verificar build y tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Tests del agente local
        run: bun run test:agent
      - name: Build
        run: bun run build
