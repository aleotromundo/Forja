[package]
name = "forja"
version = "0.1.0"
description = "Forja, entorno local de desarrollo con IA"
authors = ["Forja"]
edition = "2021"

[lib]
name = "forja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rfd = "0.15"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
